<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airball · Raywel Martin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <!-- GitHub Pages shows this page for any missing address, at any depth, so
       every link and icon here uses the site's full path -->
  <link rel="icon" type="image/png" sizes="32x32" href="/raywelfrancismartin/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/raywelfrancismartin/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;700&family=Geist+Mono:wght@400;500&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0a0a0a; --fg: #f2f0eb; --muted: #8f8c86; --line: #222220; --accent: #ff5a1f;
    }
    [data-theme="light"] {
      --bg: #f2f0eb; --fg: #111110; --muted: #6d6a64; --line: #dcd8cf; --accent: #e2470b;
    }
    :root { --green: #3ddc84; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --cond: "Barlow Condensed", "Arial Narrow", sans-serif; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 24px clamp(16px, 4vw, 48px);
      background: var(--bg);
      color: var(--fg);
      font-family: "Geist", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .brand { color: var(--fg); }
    main { align-self: center; padding: 48px 0; }
    .eyebrow { color: var(--muted); }
    h1 {
      margin: 18px 0 20px;
      font-size: clamp(76px, 17vw, 240px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.05em;
    }
    h1 em {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .line { max-width: 34ch; color: var(--muted); font-size: clamp(17px, 2vw, 20px); line-height: 1.5; }
    .home {
      display: inline-flex;
      margin-top: 28px;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: border-color 0.2s ease;
    }
    @media (hover: hover) and (pointer: fine) { .home:hover { border-color: var(--fg); } }
    footer { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }

    /* the ball drops in from above and bounces to a stop */
    .ball {
      display: inline-block;
      font-size: 0.42em;
      vertical-align: 0.12em;
      margin-left: 0.08em;
      animation: drop 1.8s cubic-bezier(0.3, 0, 0.7, 1) both;
    }
    @keyframes drop {
      0%   { transform: translateY(-120vh) rotate(0deg); }
      40%  { transform: translateY(0) rotate(160deg); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
      58%  { transform: translateY(-0.9em) rotate(220deg); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
      74%  { transform: translateY(0) rotate(270deg); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
      84%  { transform: translateY(-0.3em) rotate(295deg); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
      92%  { transform: translateY(0) rotate(310deg); }
      100% { transform: translateY(0) rotate(318deg); }
    }

    /* The court: a shot at the hoop on NBA 2K's shot meter. Hold, and let go
       while the meter is in its green window at the top */
    .court {
      position: relative;
      max-width: 640px;
      height: 220px;
      margin-top: 40px;
      margin-bottom: 22px; /* room for the distance under the ball */
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      outline: none;
    }
    .court:focus-visible { box-shadow: 0 1px 0 var(--muted); }
    .hoop { position: absolute; top: 0; right: 0; width: 90px; height: 220px; overflow: visible; pointer-events: none; }
    .hoop-back { z-index: 1; }
    .hoop-front { z-index: 3; }
    .hoop path, .hoop line, .hoop ellipse { fill: none; stroke-linecap: round; }
    .pole { stroke: color-mix(in srgb, var(--muted) 40%, transparent); stroke-width: 4; }
    .glass { stroke: var(--muted); stroke-width: 4; }
    .rim { stroke: var(--accent); stroke-width: 3; }
    .net { stroke: var(--muted); stroke-width: 1.2; opacity: 0.8; transform-box: fill-box; transform-origin: 50% 0; }
    .rock {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      width: 26px;
      height: 26px;
      pointer-events: none;
    }
    .rock svg { display: block; width: 100%; height: 100%; }
    /* Grab the ball to move your spot along the floor: its distance from the
       rim shows under it, and farther out the green window gets tighter */
    .grab {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 4;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
    }
    .grab:active, .court.dragging .grab { cursor: grabbing; }
    .court.flying .grab { pointer-events: none; }
    .spot {
      position: absolute;
      left: 0;
      bottom: -22px;
      translate: -50% 0;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
      transition: color 0.2s ease;
    }
    .spot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -7px;
      width: 1px;
      height: 5px;
      background: currentColor;
    }
    .court.dragging .spot { color: var(--fg); }
    /* the meter: NBA 2K26's "Curve" to the side of the shooter, with its
       green window showing near the top. It fills while you hold, and turns
       green, yellow or red on the release */
    .meter {
      position: absolute;
      left: 18px; /* moved with the ball (see main script) */
      bottom: 26px;
      width: 40px;
      height: 120px;
      overflow: visible;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .court.holding .meter, .meter.green, .meter.close, .meter.off { opacity: 1; transition-duration: 0.12s; }
    .meter path { fill: none; stroke-linecap: round; }
    .meter-track { stroke: color-mix(in srgb, var(--fg) 16%, transparent); stroke-width: 8; }
    .meter-window { stroke: var(--green); stroke-width: 12; stroke-dasharray: 0.11 2; stroke-dashoffset: -0.86; opacity: 0.45; }
    .meter-fill { stroke: var(--fg); stroke-width: 8; stroke-dasharray: 1 2; stroke-dashoffset: 1; }
    .meter.green .meter-fill { stroke: var(--green); filter: drop-shadow(0 0 5px var(--green)); }
    .meter.close .meter-fill { stroke: #f2c230; }
    .meter.off .meter-fill { stroke: #ff4d4d; }
    /* what happened, big, and how the release was timed, small */
    .result {
      position: absolute;
      top: 0;
      right: 104px;
      text-align: right;
      pointer-events: none;
    }
    .call {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(38px, 6vw, 56px);
      line-height: 1;
      opacity: 0;
      translate: 0 8px;
      transition: opacity 0.2s ease, translate 0.2s ease;
    }
    .call.on { opacity: 1; translate: 0 0; transition: opacity 0.3s var(--ease-out), translate 0.3s var(--ease-out); }
    .call[data-result="swish"] { color: var(--green); text-shadow: 0 0 22px color-mix(in srgb, var(--green) 45%, transparent); }
    .call[data-result="bucket"] { color: var(--fg); }
    .call[data-result="brick"] { color: var(--muted); }
    .call[data-result="airball"] { color: var(--accent); }
    /* 2K's shot feedback: dark panels with the timing (green, yellow or
       red) and the coverage. There's never a defender on a 404. */
    .panels {
      display: grid;
      justify-items: end;
      gap: 4px;
      margin-top: 10px;
      opacity: 0;
      translate: 0 6px;
      transition: opacity 0.15s ease, translate 0.15s ease;
    }
    .panels.on { opacity: 1; translate: 0 0; transition: opacity 0.25s var(--ease-out), translate 0.25s var(--ease-out); }
    .panel {
      --tone: var(--green);
      display: grid;
      min-width: 112px;
      padding: 4px 10px 5px;
      border: 1px solid rgb(255 255 255 / 0.07);
      border-top: 2px solid var(--tone);
      background: linear-gradient(180deg, #1d2023, #141618);
      text-align: left;
      font-family: var(--cond);
      text-transform: uppercase;
      line-height: 1.05;
    }
    .panel + .panel { margin-right: 22px; }
    .panel span { color: #e9e9e6; font-weight: 600; font-size: 12px; letter-spacing: 0.05em; }
    .panel b { color: var(--tone); font-weight: 800; font-size: 17px; letter-spacing: 0.02em; }
    .panels[data-grade="close"] .panel-timing { --tone: #f2c230; }
    .panel-distance { --tone: #e9e9e6; }
    .panels[data-grade="off"] .panel-timing { --tone: #ff4d4d; }
    .tally-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      max-width: 640px;
      margin-top: 12px;
    }
    .tally { color: var(--muted); font-size: 11px; }
    .sound {
      flex: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .sound svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sound .waves { transition: opacity 0.2s ease; }
    .sound.off .waves { opacity: 0; }
    .sound .cross { opacity: 0; transition: opacity 0.2s ease; }
    .sound.off .cross { opacity: 1; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .row .home { margin-top: 0; }
    .share {
      display: inline-flex;
      align-items: center;
      padding: 14px 20px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: none;
      color: var(--fg);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .share[hidden] { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .sound:hover { color: var(--fg); border-color: var(--muted); }
      .share:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ball { animation: none; }
      .call, .call.on, .panels, .panels.on { translate: none; }
    }
  </style>
</head>
<body>

  <main>

    <p class="line">That shot missed the rim. The page you're after isn't here, but the rest of the site is.</p>
    <div class="court" id="court" role="button" tabindex="0" aria-label="Shoot: hold, and let go at the top of the meter. Left and right arrows move your spot.">

      </svg>

  </main>
  <footer class="mono"><span>Malolos, Bulacan</span><a class="home-link" href="/raywelfrancismartin/#connect">Say hi ↗</a></footer>
  <script>
    // Opened from a local preview instead of GitHub Pages: point home at "/"
    if (!location.pathname.startsWith("/raywelfrancismartin/")) {
      document.querySelectorAll(".home-link").forEach(function (a) {
        a.setAttribute("href", a.getAttribute("href").replace("/raywelfrancismartin/", "/"));
      });
    }

    // Take a shot, NBA 2K26 style: hold (mouse, finger, Space or Enter) and
    // the curve meter by the ball fills in 0.9 s; let go inside its green
    // window at the top and it's a green, nothing but net. A little early or
    // late rattles in about half the time and bricks the rest; way off is an
    // airball. The timing shows in 2K's panels. A quick tap starts the meter
    // and the next tap lets go, for thumbs.
    (() => {
      const court = document.getElementById("court");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ball = court.querySelector(".rock");
      const meter = court.querySelector(".meter");
      const fill = court.querySelector(".meter-fill");
      const net = court.querySelector(".net");
      const rims = court.querySelectorAll(".rim");
      const call = court.querySelector(".call");
      const panels = court.querySelector(".panels");
      const timing = court.querySelector(".panel-timing b");
      const distance = court.querySelector(".panel-distance b");
      const grab = court.querySelector(".grab");
      const spot = court.querySelector(".spot");
      const windowPath = court.querySelector(".meter-window");
      const tally = document.querySelector(".tally");
      const share = document.querySelector(".share");
      const soundSwitch = document.querySelector(".sound");
      const FILL = 900;
      const R = 13; // the ball's radius
      const CALLS = { swish: "Green!", bucket: "Bucket.", brick: "Brick.", airball: "Airball." };
      let state = "idle";
      let pressedAt = 0;
      let tapped = false;
      let raf = 0;
      let shots = 0, made = 0, greens = 0, streak = 0, best = 0, greenRun = 0, bestGreens = 0;
      try {
        best = Number(localStorage.getItem("airballBest")) || 0;
        bestGreens = Number(localStorage.getItem("airballBestGreens")) || 0;
      } catch (e) {}

      // Sounds, made right here with Web Audio (no files): the net's swish,
      // the rim's clank, the floor's thump and the chime of a green. They
      // start with your first shot, and the switch mutes them (remembered).
      const sound = (() => {
        let ctx = null;
        let muted = false;
        try { muted = localStorage.getItem("airballMuted") === "1"; } catch (e) {}
        const context = () => {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          if (!ctx) ctx = new AC();
          if (ctx.state === "suspended") ctx.resume();
          return ctx;
        };
        const envelope = (c, peak, at, attack, decay) => {
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(peak, at + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
          g.connect(c.destination);
          return g;
        };
        const noise = (c, secs) => {
          const buf = c.createBuffer(1, Math.ceil(c.sampleRate * secs), c.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          const src = c.createBufferSource();
          src.buffer = buf;
          return src;
        };
        const kinds = {
          swish(c, at) {
            // the net: a soft, bright rush of air that falls away
            const n = noise(c, 0.5);
            const f = c.createBiquadFilter();
            f.type = "bandpass";
            f.Q.value = 0.9;
            f.frequency.setValueAtTime(5200, at);
            f.frequency.exponentialRampToValueAtTime(2400, at + 0.4);
            n.connect(f).connect(envelope(c, 0.3, at, 0.03, 0.42));
            n.start(at);
            n.stop(at + 0.5);
          },
          clank(c, at) {
            // the rim: a few metal partials that ring and die
            [[587, 0.16, 0.5], [1374, 0.08, 0.35], [2211, 0.05, 0.25]].forEach(([hz, peak, decay]) => {
              const o = c.createOscillator();
              o.type = "triangle";
              o.frequency.value = hz;
              o.connect(envelope(c, peak, at, 0.004, decay));
              o.start(at);
              o.stop(at + decay + 0.05);
            });
          },
          bounce(c, at, level = 1) {
            // the floor: a low thump, softer each bounce
            const o = c.createOscillator();
            o.frequency.setValueAtTime(150, at);
            o.frequency.exponentialRampToValueAtTime(55, at + 0.12);
            o.connect(envelope(c, 0.45 * level, at, 0.005, 0.15));
            o.start(at);
            o.stop(at + 0.2);
          },
          green(c, at) {
            // the green: a bright two-note chime
            [[1568, 0], [2349, 0.07]].forEach(([hz, later]) => {
              const o = c.createOscillator();
              o.frequency.value = hz;
              o.connect(envelope(c, 0.14, at + later, 0.01, 0.6));
              o.start(at + later);
              o.stop(at + later + 0.7);
            });
          }
        };
        const show = () => {
          soundSwitch.setAttribute("aria-pressed", String(!muted));
          soundSwitch.querySelector("span").textContent = muted ? "Sound off" : "Sound on";
          soundSwitch.classList.toggle("off", muted);
        };
        soundSwitch.addEventListener("click", () => {
          muted = !muted;
          try { localStorage.setItem("airballMuted", muted ? "1" : "0"); } catch (e) {}
          show();
        });
        show();
        return {
          // `ms` from now
          play(kind, ms = 0, level) {
            if (muted) return;
            const c = context();
            if (c) kinds[kind](c, c.currentTime + ms / 1000, level);
          },
          wake() {
            if (!muted) context();
          }
        };
      })();

      const easeOut = (t) => 1 - (1 - t) ** 3;
      // Your spot on the floor, in feet from the rim (8 to 30; it starts at
      // the three-point line, 23'9"). The closer you are, the wider the green
      // window: 15% of the meter at 8 ft, 7% at 30 ft.
      let feet = 23.75;
      const NEAR = 8, FAR = 30;
      const rimX = () => court.clientWidth - 37;
      const range = () => ({ lo: 40, hi: rimX() - 130 }); // where the ball can stand, far to near
      const xFor = (ft) => { const { lo, hi } = range(); return hi - ((ft - NEAR) / (FAR - NEAR)) * (hi - lo); };
      const feetFor = (x) => { const { lo, hi } = range(); return NEAR + ((hi - Math.min(hi, Math.max(lo, x))) / (hi - lo)) * (FAR - NEAR); };
      const far = () => (feet - NEAR) / (FAR - NEAR); // 0 near, 1 far
      const greenWindow = () => {
        const size = 0.15 - 0.08 * far();
        return { lo: 0.915 - size / 2, hi: 0.915 + size / 2 };
      };
      const feetText = (ft) => {
        let whole = Math.floor(ft);
        let inches = Math.round((ft - whole) * 12);
        if (inches === 12) { whole += 1; inches = 0; }
        return `${whole}'${inches}"`;
      };
      const rest = () => ({ x: xFor(feet), y: court.clientHeight - R });
      // the ball rises to its set point as the meter fills
      const setPoint = (p) => ({ x: rest().x, y: rest().y - 46 * easeOut(Math.min(p, 1)) });
      const place = ({ x, y }) => (ball.style.transform = `translate(${x - R}px, ${y - R}px)`);
      // the ball, its grab handle, the meter beside it, the distance under it
      // and the meter's green window all follow the spot
      const settle = () => {
        const { x, y } = rest();
        place({ x, y });
        grab.style.transform = `translate(${x - 24}px, ${y - 24}px)`;
        meter.style.left = `${x - 52}px`;
        spot.style.left = `${x}px`;
        spot.textContent = feetText(feet);
        const { lo, hi } = greenWindow();
        windowPath.style.strokeDasharray = `${(hi - lo).toFixed(3)} 2`;
        windowPath.style.strokeDashoffset = String(-lo.toFixed(3));
      };
      settle();
      addEventListener("resize", () => state === "idle" && settle());

      // dragging the ball moves the spot (it never shoots)
      grab.addEventListener("pointerdown", (e) => {
        if (state !== "idle" || e.button > 0) return;
        e.preventDefault();
        e.stopPropagation();
        try { grab.setPointerCapture(e.pointerId); } catch (err) {}
        court.classList.add("dragging");
        const box = court.getBoundingClientRect();
        const move = (ev) => {
          feet = feetFor(ev.clientX - box.left);
          settle();
        };
        const end = () => {
          court.classList.remove("dragging");
          grab.removeEventListener("pointermove", move);
          grab.removeEventListener("pointerup", end);
          grab.removeEventListener("pointercancel", end);
        };
        grab.addEventListener("pointermove", move);
        grab.addEventListener("pointerup", end);
        grab.addEventListener("pointercancel", end);
      });

      // pieces of a flight: an arc (even speed across, gravity up and down),
      // a drop (speeding up) and a hop off the rim or the floor. `hit` is the
      // sound when the ball gets to the end of the piece.
      const arc = (a, b, lift, ms, hit) => {
        const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift * 2 };
        return { ms, hit, at: (t) => ({ x: (1 - t) ** 2 * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) ** 2 * a.y + 2 * (1 - t) * t * c.y + t * t * b.y }) };
      };
      const drop = (a, b, ms, hit) => ({ ms, hit, at: (t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * (0.35 * t + 0.65 * t * t) }) });

      const press = () => {
        if (state === "holding" && tapped) return release();
        if (state !== "idle") return;
        sound.wake();
        state = "holding";
        tapped = false;
        pressedAt = performance.now();
        court.classList.add("holding");
        meter.classList.remove("green", "close", "off");
        call.classList.remove("on");
        panels.classList.remove("on");
        const tick = (now) => {
          const p = (now - pressedAt) / FILL;
          fill.style.strokeDashoffset = String(1 - Math.min(p, 1));
          place(setPoint(p));
          if (p >= 1.25) return release(); // held too long: it goes up anyway, very late
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      };
      const lift = () => {
        if (state !== "holding" || tapped) return;
        // a quick tap: the meter keeps going and the next tap lets go
        if (performance.now() - pressedAt < 150) return (tapped = true);
        release();
      };

      const release = () => {
        cancelAnimationFrame(raf);
        const p = (performance.now() - pressedAt) / FILL;
        state = "flying";
        court.classList.remove("holding");
        court.classList.add("flying");
        const { lo, hi } = greenWindow();
        const grade = p < lo - 0.14 ? "Very early" : p < lo ? "Slightly early" : p <= hi ? "Excellent" : p <= hi + 0.11 ? "Slightly late" : "Very late";
        const green = grade === "Excellent";
        const close = grade.startsWith("Slightly");
        const mark = green ? "green" : close ? "close" : "off";
        meter.classList.add(mark);
        fill.style.strokeDashoffset = String(1 - Math.min(p, 1));
        // 2K's feedback, the moment you let go
        timing.textContent = grade;
        distance.textContent = feetText(feet);
        panels.dataset.grade = mark;
        panels.classList.add("on");
        if (green) sound.play("green");
        shoot(green ? "swish" : close ? (Math.random() < 0.55 ? "bucket" : "brick") : "airball", setPoint(p));
      };

      const shoot = (result, from) => {
        const floor = court.clientHeight - R;
        const rim = { x: rimX(), y: 96 };
        // farther out: a higher arc and a longer flight
        const lift = 72 + 48 * far();
        const flight = Math.round(700 + 280 * far());
        const through = [
          drop({ x: rim.x, y: rim.y - 10 }, { x: rim.x, y: rim.y + 42 }, 170),
          drop({ x: rim.x, y: rim.y + 42 }, { x: rim.x - 6, y: floor }, 250, ["bounce", 1]),
          arc({ x: rim.x - 6, y: floor }, { x: rim.x - 44, y: floor }, 16, 420, ["bounce", 0.45])
        ];
        const front = { x: rim.x - 21, y: rim.y - 13 };
        let path;
        let arrive; // when it gets to the rim, or lands short
        if (result === "swish") {
          path = [arc(from, { x: rim.x, y: rim.y - 10 }, lift, flight, ["swish"]), ...through];
          arrive = flight;
        } else if (result === "bucket") {
          // off the front of the rim, up, and down through
          path = [arc(from, front, lift, flight, ["clank"]), arc(front, { x: rim.x, y: rim.y - 10 }, 9, 260, ["swish"]), ...through];
          arrive = flight;
        } else if (result === "brick") {
          const out = { x: rim.x - 90, y: floor };
          path = [
            arc(from, front, lift, flight, ["clank"]),
            arc(front, out, 22, 640, ["bounce", 1]),
            arc(out, { x: out.x - 36, y: floor }, 10, 360, ["bounce", 0.5]),
            arc({ x: out.x - 36, y: floor }, { x: out.x - 52, y: floor }, 4, 220, ["bounce", 0.25])
          ];
          arrive = flight;
        } else {
          const land = { x: Math.max(from.x + 40, rim.x - 70 - Math.random() * Math.min(70, (rim.x - from.x) * 0.4)), y: floor };
          path = [
            arc(from, land, lift * 0.65, Math.round(flight * 0.9), ["bounce", 1]),
            arc(land, { x: land.x + 30, y: floor }, 11, 360, ["bounce", 0.5]),
            arc({ x: land.x + 30, y: floor }, { x: land.x + 46, y: floor }, 4, 220, ["bounce", 0.25])
          ];
          arrive = Math.round(flight * 0.9);
        }
        // the flight as keyframes, with backspin; each piece's sound is
        // scheduled for the moment the ball gets there
        const total = path.reduce((sum, piece) => sum + piece.ms, 0);
        const frames = [];
        let time = 0;
        path.forEach((piece, i) => {
          for (let k = i ? 1 : 0; k <= 14; k++) {
            const t = k / 14;
            const { x, y } = piece.at(t);
            const ms = time + piece.ms * t;
            frames.push({ transform: `translate(${(x - R).toFixed(1)}px, ${(y - R).toFixed(1)}px) rotate(${(-ms * 0.6).toFixed(0)}deg)`, offset: ms / total });
          }
          time += piece.ms;
          if (piece.hit && !reduce) sound.play(piece.hit[0], time, piece.hit[1]);
        });
        const fly = ball.animate(frames, { duration: reduce ? 1 : total, fill: "forwards" });

        setTimeout(() => {
          call.textContent = CALLS[result];
          call.dataset.result = result;
          call.classList.add("on");
          if (!reduce && result !== "airball") {
            // the rim shakes when it's hit; the net kicks when the ball goes through
            if (result !== "swish") rims.forEach((r) => r.animate([{ transform: "translateY(2px)" }, { transform: "translateY(-1px)" }, { transform: "none" }], { duration: 240 }));
            if (result !== "brick") {
              setTimeout(() => net.animate([{ transform: "none" }, { transform: "scaleY(1.25) skewX(-4deg)" }, { transform: "scaleY(0.92)" }, { transform: "none" }], { duration: 520, easing: "ease-out" }), result === "swish" ? 60 : 300);
            }
          }
          shots += 1;
          if (result === "swish" || result === "bucket") {
            made += 1;
            streak += 1;
          } else {
            streak = 0;
          }
          greenRun = result === "swish" ? greenRun + 1 : 0;
          if (result === "swish") greens += 1;
          try {
            if (streak > best) localStorage.setItem("airballBest", String((best = streak)));
            if (greenRun > bestGreens) localStorage.setItem("airballBestGreens", String((bestGreens = greenRun)));
          } catch (e) {
            best = Math.max(best, streak);
            bestGreens = Math.max(bestGreens, greenRun);
          }
          tally.textContent = `${made}/${shots} made · ${greens} green${greens === 1 ? "" : "s"} · best streak ${best}`;
          share.hidden = !(best || bestGreens);
        }, reduce ? 0 : arrive);

        // then the ball fades back to the start for the next one
        fly.finished.then(() => new Promise((r) => setTimeout(r, reduce ? 900 : 500))).then(() => {
          const out = ball.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 180, fill: "forwards" });
          out.finished.then(() => {
            settle();
            fly.cancel();
            out.cancel();
            if (!reduce) ball.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
            meter.classList.remove("green", "close", "off");
            fill.style.strokeDashoffset = "1";
            court.classList.remove("flying");
            state = "idle";
          });
        });
      };

      // Share your best run: the share sheet on phones, and on computers the
      // line is copied, ready to paste to a friend. The link is a page that
      // doesn't exist, so it lands on this game.
      const shareText = () => (bestGreens > 1
        ? `I hit ${bestGreens} greens in a row on Raywel's Airball page. Beat that:`
        : bestGreens === 1
          ? "I hit a green on Raywel's Airball page. Beat that:"
          : `I made ${best} in a row on Raywel's Airball page. Beat that:`);
      const SHARE_URL = "https://matimbu.github.io/raywelfrancismartin/airball";
      share.hidden = !(best || bestGreens);
      share.addEventListener("click", async () => {
        if (!best && !bestGreens) return;
        const label = share.querySelector("span");
        if (navigator.share && matchMedia("(pointer: coarse)").matches) {
          try {
            await navigator.share({ title: "Airball.", text: shareText(), url: SHARE_URL });
          } catch (e) {}
          return;
        }
        let ok = false;
        try {
          await navigator.clipboard.writeText(`${shareText()} ${SHARE_URL}`);
          ok = true;
        } catch (e) {}
        label.textContent = ok ? "Copied" : "Couldn't copy";
        setTimeout(() => (label.textContent = "Share my streak"), 1600);
      });

      court.addEventListener("pointerdown", (e) => {
        if (e.button > 0) return;
        e.preventDefault();
        press();
      });
      addEventListener("pointerup", lift);
      addEventListener("pointercancel", lift);
      court.addEventListener("contextmenu", (e) => e.preventDefault());
      court.addEventListener("keydown", (e) => {
        // the arrows move your spot a foot at a time
        if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && state === "idle") {
          e.preventDefault();
          feet = Math.min(FAR, Math.max(NEAR, feet + (e.key === "ArrowLeft" ? 1 : -1)));
          settle();
          return;
        }
        if (e.key !== " " && e.key !== "Enter") return;
        e.preventDefault();
        if (!e.repeat) press();
      });
      court.addEventListener("keyup", (e) => {
        if (e.key === " " || e.key === "Enter") lift();
      });
    })();
  </script>
  <!-- Visitor stats (GoatCounter, same as index.html): missing pages show up
       in the dashboard under the address people tried -->
  <script data-goatcounter="https://matimbu.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
